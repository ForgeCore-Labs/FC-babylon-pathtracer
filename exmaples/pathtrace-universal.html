<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1">
	<title>pt_lib — universal (data-driven) path tracing test</title>
	<style>
		html, body {
			overflow: hidden;
			width: 100%;
			height: 100%;
			margin: 0;
			padding: 0;
			background: #000;
		}

		#renderCanvas {
			width: 100%;
			height: 100%;
			touch-action: none;
			outline: none;
		}

		#info {
			position: fixed;
			top: 8px;
			width: 100%;
			text-align: center;
			font-family: monospace;
			font-size: medium;
			color: #fff;
			pointer-events: none;
			user-select: none;
			text-shadow: 0 0 4px #000;
		}

		#help {
			position: fixed;
			left: 1%;
			bottom: 2%;
			font-family: monospace;
			font-size: small;
			color: rgb(200, 200, 200);
			pointer-events: none;
			user-select: none;
			text-shadow: 0 0 4px #000;
		}

		#ui {
			position: fixed;
			right: 10px;
			top: 10px;
			font-family: monospace;
			font-size: 12px;
			color: #ddd;
			background: rgba(0, 0, 0, 0.55);
			border: 1px solid rgba(255, 255, 255, 0.15);
			padding: 10px 12px;
			border-radius: 6px;
			user-select: none;
		}

		#ui label { display: block; margin-bottom: 6px; }
		#ui select, #ui input {
			background: #111;
			color: #eee;
			border: 1px solid #444;
			font-family: monospace;
		}
		#ui button {
			background: #222;
			color: #eee;
			border: 1px solid #444;
			padding: 2px 10px;
			cursor: pointer;
			font-family: monospace;
		}

		#lightIcons {
			position: fixed;
			inset: 0;
			overflow: hidden;
			pointer-events: none;
		}

		.pt-light-icon {
			position: absolute;
			width: 16px;
			height: 16px;
			margin: -8px 0 0 -8px;
			border: 2px solid currentColor;
			border-radius: 50%;
			box-sizing: border-box;
			display: none;
			color: #fff;
		}

		.pt-light-icon::after {
			content: '';
			position: absolute;
			inset: 3px;
			border-radius: 50%;
			background: currentColor;
		}

		.pt-light-name {
			position: absolute;
			left: 20px;
			top: -2px;
			font-family: monospace;
			font-size: 11px;
			line-height: 16px;
			white-space: nowrap;
			color: currentColor;
			text-shadow: 0 0 3px #000, 0 0 3px #000;
		}
	</style>
</head>

<body>
	<canvas id="renderCanvas" touch-action="none"></canvas>
	<div id="lightIcons"></div>

	<div id="info">loading…</div>
	<div id="help">
		drag: look &nbsp;|&nbsp; arrows/WASD: move &nbsp;|&nbsp; Inspector eye toggles sync automatically &nbsp;|&nbsp; material sliders update live; other property edits: press "apply changes"
	</div>

	<div id="ui">
		<label>view
			<select id="uiView">
				<option value="0">beauty</option>
				<option value="1">albedo</option>
				<option value="2">normals</option>
				<option value="3">direct light</option>
				<option value="4">depth</option>
			</select>
		</label>
		<label>model
			<select id="uiModel">
				<option value="wasabi.glb" selected>wasabi.glb (1.6 MB)</option>
				<option value="polident.glb">polident.glb (2.0 MB)</option>
				<option value="repellent.glb">repellent.glb (2.0 MB)</option>
				<option value="sauce.glb">sauce.glb (2.5 MB)</option>
				<option value="cupnoodle.glb">cupnoodle.glb (2.7 MB)</option>
				<option value="blendy.glb">blendy.glb (3.7 MB)</option>
				<option value="test_tx.glb">test_tx.glb</option>
				<option value="none">none</option>
			</select>
		</label>
		<label>env
			<select id="uiEnv">
				<option value="none">none</option>
				<option value="environment.env" selected>environment.env (cube)</option>
				<option value="environment_b.env">environment_b.env (cube)</option>
			</select>
		</label>
		<label>max samples
			<input id="uiSamples" type="number" min="0" step="16" value="256" style="width: 70px">
		</label>
		<label>firefly clamp <output id="uiFireflyOut">8</output>
			<input id="uiFirefly" type="range" min="0" max="50" step="1" value="8">
		</label>
		<label>seed
			<input id="uiSeed" type="number" min="0" step="1" value="0" style="width: 70px">
		</label>
		<label>OIDN module url
			<input id="uiOidnUrl" type="text" value="" placeholder="./pt_lib/vendor/oidn/oidn.js" style="width: 190px">
		</label>
		<label><input id="uiOidn" type="checkbox"> OIDN denoise (one-shot)</label>
		<label><input id="uiAtrous" type="checkbox"> à-trous denoise (GPU)</label>
		<label>à-trous passes
			<input id="uiAtrousIters" type="number" min="1" max="6" step="1" value="3" style="width: 70px">
		</label>
		<label>à-trous φ normal <output id="uiPhiNOut">128</output>
			<input id="uiPhiN" type="range" min="0" max="256" step="1" value="128">
		</label>
		<label>à-trous φ albedo <output id="uiPhiAOut">32</output>
			<input id="uiPhiA" type="range" min="0" max="64" step="1" value="32">
		</label>
		<label>à-trous φ depth <output id="uiPhiDOut">32</output>
			<input id="uiPhiD" type="range" min="0" max="64" step="1" value="32">
		</label>
		<label>resolution
			<input id="uiRes" type="range" min="0.25" max="1" step="0.05" value="1">
		</label>
		<label>material
			<select id="uiMaterial">
				<option value="0">mirror</option>
				<option value="1" selected>gold</option>
				<option value="2">red</option>
				<option value="3">blue</option>
				<option value="4">green</option>
			</select>
		</label>
		<label>metallic <output id="uiMetalOut">1.00</output>
			<input id="uiMetal" type="range" min="0" max="1" step="0.01" value="1">
		</label>
		<label>roughness <output id="uiRoughOut">0.30</output>
			<input id="uiRough" type="range" min="0" max="1" step="0.01" value="0.30">
		</label>
		<label><input id="uiLights" type="checkbox" checked> show lights</label>
		<label><input id="uiLightIcons" type="checkbox" checked> light icons</label>
		<label><input id="uiWorker" type="checkbox" checked> geometry worker</label>
		<label><input id="uiAovs" type="checkbox"> AOVs (identity denoise test)</label>
		<label><input id="uiPost" type="checkbox"> vignette (post-process)</label>
		<label>post strength <output id="uiPostOut">0.60</output>
			<input id="uiPostAmt" type="range" min="0" max="1" step="0.05" value="0.6">
		</label>
		<button id="uiReset">reset</button>
		<button id="uiRebuild">apply changes</button>
		<button id="uiExport">export PNG</button>
	</div>

	<!-- 1. Babylon engine + loaders + Inspector (debug layer always on) -->
	<script src="https://cdn.babylonjs.com/babylon.max.js"></script>
	<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
	<script src="https://cdn.babylonjs.com/inspector/babylon.inspector.bundle.js"></script>

	<!-- 2. pt_lib core: GLSL registry + shaders + includes + BVH -->
	<script src="pt_lib/dist/pt_lib.core.js"></script>

	<!-- 3. pt_lib library modules -->
	<script src="pt_lib/src/core/composer.js"></script>
	<script src="pt_lib/src/core/uniforms.js"></script>
	<script src="pt_lib/src/core/geometry-packing.js"></script>
	<script src="pt_lib/src/core/geometry-worker.js"></script>
	<script src="pt_lib/src/core/ingest.js"></script>
	<script src="pt_lib/src/denoise/oidn.js"></script>
	<script src="pt_lib/src/denoise/atrous.js"></script>
	<script src="pt_lib/src/PathTracer.js"></script>

	<!-- 4. the data-driven scene shader (registers PT_LIB.glsl.scenes["universal"]) -->
	<script src="pt_lib/src/scenes/universal/UniversalPathTracing_FragmentShader.js"></script>
	<script src="pt_lib/src/scenes/universal/universal-scene.js"></script>

	<!-- 5. build a normal Babylon scene; the tracer picks it up automatically -->
	<script>
		const canvas = document.getElementById('renderCanvas');
		const info = document.getElementById('info');

		// --- diagnostics -------------------------------------------------
		// Main-thread watchdog: if this fires, the freeze is JavaScript, not GPU.
		let lastTick = performance.now();
		(function tick() {
			const t = performance.now();
			if (t - lastTick > 250) {
				console.log('[pt] MAIN THREAD BLOCKED for ' + Math.round(t - lastTick) + ' ms');
			}
			lastTick = t;
			requestAnimationFrame(tick);
		})();

		window.addEventListener('error', function (e) {
			console.log('[pt] window error: ' + (e.message || e));
		});
		window.addEventListener('unhandledrejection', function (e) {
			console.log('[pt] unhandled rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
		});

		let sceneRef = null;
		let assetMeshes = [];
		let envTexture = null;
		// Ball materials, exposed so the UI sliders can edit a live PBRMaterial and
		// exercise the adapter's tMaterialData sync (no re-ingest, no recompile).
		let demoMaterials = [];

		// Assigns (or clears) scene.environmentTexture the normal Babylon way. A
		// prefiltered cube map drives image-based lighting and metal reflections.
		function setEnvironment(fileName) {
			if (envTexture) {
				if (sceneRef && sceneRef.environmentTexture === envTexture) {
					sceneRef.environmentTexture = null;
				}
				envTexture.dispose();
				envTexture = null;
			}
			if (!fileName || fileName === 'none' || !sceneRef) return;
			try {
				const tex = BABYLON.CubeTexture.CreateFromPrefilteredData(
					'./textures/' + fileName, sceneRef
				);
				envTexture = tex;
				sceneRef.environmentTexture = tex;
			} catch (e) {
				console.warn('[demo] environment load failed:', e && e.message);
			}
		}

		// Loads (or swaps) a glTF asset the normal Babylon way, then auto-fits it.
		async function loadAsset(fileName) {
			if (assetMeshes.length) {
				assetMeshes.forEach(function (m) { m.dispose(false, true); });
				assetMeshes = [];
			}
			if (!fileName || fileName === 'none' || !sceneRef) return;

			const result = await BABYLON.SceneLoader.ImportMeshAsync(
				null, './model/', fileName, sceneRef
			);
			assetMeshes = result.meshes;

			// Auto-fit: scale so the largest dimension is ~2 world units, sit it
			// on the ground, centre it behind the spheres. Keeps arbitrary assets
			// from coming in comically large or small.
			const root = result.meshes[0];
			root.computeWorldMatrix(true);
			const bounds = root.getHierarchyBoundingVectors(true);
			const size = bounds.max.subtract(bounds.min);
			const maxDim = Math.max(size.x, size.y, size.z) || 1;
			const fit = 2.0 / maxDim;

			root.scaling.setAll(fit);
			root.position.set(
				-(bounds.min.x + bounds.max.x) * 0.5 * fit,
				-bounds.min.y * fit,
				4.5 - (bounds.min.z + bounds.max.z) * 0.5 * fit
			);
		}

		const app = PT_LIB.scenes.universal.create(canvas, {
			resolutionScale: 1.0,
			maxSamples: 256,
			cameraPosition: [0, 2, -9],

			// Worker ingest progress (opt-in path). Shown in place of the plain
			// "re-ingesting scene…" status so a slow pack is not mistaken for a hang.
			onIngestProgress: function (p) {
				const total = p.total || 1;
				setStatus('ingesting — ' + p.phase + ' ' + Math.round((100 * p.done) / total) + '%');
			},

			// Cap a single sample's luminance (linear HDR) before it joins the
			// accumulation, to kill high-variance specular fireflies. 0 = off.
			fireflyClamp: 8,

			setup: async function (scene, camera) {
				sceneRef = scene;
				camera.setTarget(new BABYLON.Vector3(0, 1, 0));

				// ---- ground ----
				const ground = BABYLON.MeshBuilder.CreateBox('ground', {
					width: 24, height: 0.5, depth: 24
				}, scene);
				ground.position.y = -0.25;
				const groundMat = new BABYLON.StandardMaterial('groundMat', scene);
				groundMat.diffuseColor = new BABYLON.Color3(0.75, 0.75, 0.78);
				ground.material = groundMat;

				// ---- a row of spheres, all created Babylon-style ----
				const palette = [
					{ color: new BABYLON.Color3(0.95, 0.9, 0.8), metallic: 1.0, roughness: 0.05 }, // mirror
					{ color: new BABYLON.Color3(0.92, 0.75, 0.25), metallic: 1.0, roughness: 0.30 }, // gold
					{ color: new BABYLON.Color3(0.85, 0.12, 0.10), metallic: 0.0, roughness: 0.80 }, // red
					{ color: new BABYLON.Color3(0.15, 0.40, 0.85), metallic: 0.0, roughness: 0.50 }, // blue
					{ color: new BABYLON.Color3(0.20, 0.75, 0.30), metallic: 0.0, roughness: 0.90 }  // green
				];
				const ballMaterials = [];
				palette.forEach(function (entry, index) {
					const ball = BABYLON.MeshBuilder.CreateSphere('ball' + index, {
						diameter: 1.6, segments: 40
					}, scene);
					ball.position.set((index - 2) * 2.1, 0.8, 0);
					const mat = new BABYLON.PBRMaterial('ballMat' + index, scene);
					mat.albedoColor = entry.color;
					mat.metallic = entry.metallic;
					mat.roughness = entry.roughness;
					ball.material = mat;
					ballMaterials.push(mat);
				});
				demoMaterials = ballMaterials;

				// ---- a small emissive marker ----
				const lamp = BABYLON.MeshBuilder.CreateSphere('lamp', {
					diameter: 0.4, segments: 16
				}, scene);
				lamp.position.set(0, 2.6, 0);
				const lampMat = new BABYLON.PBRMaterial('lampMat', scene);
				lampMat.albedoColor = new BABYLON.Color3(1, 1, 1);
				lampMat.emissiveColor = new BABYLON.Color3(1, 0.95, 0.85);
				lampMat.emissiveIntensity = 3.0;
				lamp.material = lampMat;

				// ---- two coloured lights (Babylon style) ----
				const key = new BABYLON.PointLight('key', new BABYLON.Vector3(-3, 6, -4), scene);
				key.intensity = 320;
				key.diffuse = new BABYLON.Color3(1.0, 0.85, 0.7);

				const fill = new BABYLON.PointLight('fill', new BABYLON.Vector3(4, 5, -2), scene);
				fill.intensity = 220;
				fill.diffuse = new BABYLON.Color3(0.4, 0.55, 1.0);

				const ambient = new BABYLON.HemisphericLight('ambient', new BABYLON.Vector3(0, 1, 0), scene);
				ambient.intensity = 0.25;

				// ---- image-based environment (drives IBL in the tracer) ----
				setEnvironment(document.getElementById('uiEnv').value);

				// ---- load an asset the Babylon way ----
				try {
					await loadAsset(document.getElementById('uiModel').value);
				} catch (e) {
					console.warn('[demo] glTF import skipped:', e && e.message);
				}
			}
		});

		// --- light icon overlay -------------------------------------------------
		// The tracer's final pass blits the tonemapped image straight to the
		// canvas *after* scene.render(), so a Babylon gizmo/mesh drawn in the
		// scene would be painted over. This DOM layer is composited by the
		// browser above the canvas, so the icons survive the blit. Each icon is
		// simply the projection of a light's world position through the camera.
		//
		// Mirrors ingest.js: only point and spot lights live at a position
		// (directional and hemispheric lights are skipped).
		let showLightIcons = true;
		const lightIconLayer = document.getElementById('lightIcons');
		const lightIcons = new Map(); // light.uniqueId -> element
		const lightIconProjectMatrix = BABYLON.Matrix.Identity();

		function lightIconFor(light) {
			let el = lightIcons.get(light.uniqueId);
			if (!el) {
				el = document.createElement('div');
				el.className = 'pt-light-icon';
				const label = document.createElement('span');
				label.className = 'pt-light-name';
				label.textContent = light.name || 'light';
				el.appendChild(label);
				lightIconLayer.appendChild(el);
				lightIcons.set(light.uniqueId, el);
			}
			return el;
		}

		function updateLightIcons() {
			if (!showLightIcons) {
				if (lightIconLayer.style.display !== 'none') {
					lightIconLayer.style.display = 'none';
				}
				return;
			}
			lightIconLayer.style.display = '';

			const scene = app.scene;
			const camera = scene && scene.activeCamera;
			if (!camera) return;

			const rect = canvas.getBoundingClientRect();
			// Project into CSS pixels (the canvas may be scaled by devicePixelRatio
			// or resolutionScale, so engine render size is the wrong space here).
			const viewport = camera.viewport.toGlobal(
				canvas.clientWidth || rect.width,
				canvas.clientHeight || rect.height
			);
			const transform = scene.getTransformMatrix();

			const alive = new Set();
			for (let i = 0; i < scene.lights.length; i++) {
				const light = scene.lights[i];
				const hasPosition =
					light instanceof BABYLON.PointLight ||
					light instanceof BABYLON.SpotLight;
				if (!hasPosition || !light.position) continue;
				if (typeof light.isEnabled === 'function' && !light.isEnabled()) continue;

				const el = lightIconFor(light);
				alive.add(light.uniqueId);

				const worldPos =
					typeof light.getAbsolutePosition === 'function'
						? light.getAbsolutePosition()
						: light.position;
				const p = BABYLON.Vector3.Project(
					worldPos, lightIconProjectMatrix, transform, viewport
				);
				if (p.z < 0 || p.z > 1) { // behind the camera
					el.style.display = 'none';
					continue;
				}

				const c = light.diffuse || light.diffuseColor;
				if (c) {
					el.style.color = 'rgb(' +
						Math.round(Math.max(0, Math.min(1, c.r)) * 255) + ',' +
						Math.round(Math.max(0, Math.min(1, c.g)) * 255) + ',' +
						Math.round(Math.max(0, Math.min(1, c.b)) * 255) + ')';
				}
				el.style.display = 'block';
				el.style.left = (rect.left + p.x) + 'px';
				el.style.top = (rect.top + p.y) + 'px';
			}

			// Drop icons for lights that were removed from the scene.
			lightIcons.forEach(function (el, id) {
				if (alive.has(id)) return;
				el.remove();
				lightIcons.delete(id);
			});
		}

		function setStatus(extra, isLocked) {
			const tris = app.triangleCount ? app.triangleCount.toFixed(0) : '0';
			info.textContent = 'pt_lib universal — ' + tris + ' triangles' +
				(extra ? ' — ' + extra : '');
			info.style.color = isLocked ? '#9be89b' : '#fff';
		}

		function applyUISettings() {
			const pt = app.pathTracer;
			if (!pt) return;
			app.debugMode = parseFloat(document.getElementById('uiView').value) || 0;
			app.showLights = document.getElementById('uiLights').checked;
			pt.setMaxSamples(parseInt(document.getElementById('uiSamples').value, 10) || 0);
			pt.options.resolutionScale = parseFloat(document.getElementById('uiRes').value) || 1;
			pt.resize();
			pt.reset();
		}

		function attachStatus(pt) {
			pt.onProgressObservable.add(function (samples) {
				const cap = pt.options.maxSamples;
				setStatus('samples ' + samples + (cap > 0 ? ' / ' + cap : ''), false);
			});
			pt.onConvergedObservable.add(function (samples) {
				setStatus(
					'converged at ' + samples +
					' — locked (move the camera or press reset)',
					true
				);
			});
		}

		// The tracer instance is stable, and the adapter listens to Babylon's own
		// observables, so scene edits (including from the Inspector) re-ingest
		// automatically. This only exists to force a refresh on demand.
		function forceReingest() {
			setStatus('re-ingesting scene…');
			return app.reingest();
		}

		function wireUI() {
			const view = document.getElementById('uiView');
			const model = document.getElementById('uiModel');
			const env = document.getElementById('uiEnv');
			const samples = document.getElementById('uiSamples');
			const firefly = document.getElementById('uiFirefly');
			const fireflyOut = document.getElementById('uiFireflyOut');
			const seed = document.getElementById('uiSeed');
			const oidnToggle = document.getElementById('uiOidn');
			const oidnUrl = document.getElementById('uiOidnUrl');
			const atrousToggle = document.getElementById('uiAtrous');
			const atrousIters = document.getElementById('uiAtrousIters');
			const phiN = document.getElementById('uiPhiN');
			const phiA = document.getElementById('uiPhiA');
			const phiD = document.getElementById('uiPhiD');
			const phiNOut = document.getElementById('uiPhiNOut');
			const phiAOut = document.getElementById('uiPhiAOut');
			const phiDOut = document.getElementById('uiPhiDOut');
			const res = document.getElementById('uiRes');
			const lights = document.getElementById('uiLights');
			const icons = document.getElementById('uiLightIcons');
			const material = document.getElementById('uiMaterial');
			const metal = document.getElementById('uiMetal');
			const rough = document.getElementById('uiRough');
			const metalOut = document.getElementById('uiMetalOut');
			const roughOut = document.getElementById('uiRoughOut');
			const post = document.getElementById('uiPost');
			const postAmt = document.getElementById('uiPostAmt');
			const postOut = document.getElementById('uiPostOut');
			const workerToggle = document.getElementById('uiWorker');
			const aovsToggle = document.getElementById('uiAovs');

			// --- example post-process pass ---------------------------------
			// Appended after the tonemap, so it runs in display space. Same shader
			// shape as the tracer's own passes: ES 3.00 with its own `out`, sampling
			// the previous stage. `uniforms` may be literals or per-frame getters,
			// which is how the strength slider stays live.
			const vignettePass = {
				name: 'demoVignette',
				uniforms: {
					uAmount: function () {
						return parseFloat(postAmt.value);
					},
					uResolution: function (pt) {
						return [
							pt.engine.getRenderWidth(),
							pt.engine.getRenderHeight()
						];
					}
				},
				fragmentShader: [
					'#version 300 es',
					'precision highp float;',
					'precision highp sampler2D;',
					'uniform sampler2D textureSampler;',
					'uniform float uAmount;',
					'uniform vec2 uResolution;',
					'out vec4 glFragColor;',
					'void main(void) {',
					'\tvec2 uv = gl_FragCoord.xy / uResolution;',
					'\tvec3 c = texture(textureSampler, uv).rgb;',
					'\tvec2 d = uv - 0.5;',
					'\tfloat v = clamp(1.0 - uAmount * dot(d, d) * 4.0, 0.0, 1.0);',
					'\tglFragColor = vec4(c * v, 1.0);',
					'}'
				].join('\n')
			};

			// These sliders edit a live Babylon PBRMaterial. The adapter's per-frame
			// updateMaterialData() notices the scalar change and re-accumulates — no
			// re-ingest and no shader recompile. That live update is exactly what the
			// tMaterialData texture exists for, so this is the direct browser test.
			function selectedMaterial() {
				const index = parseInt(material.value, 10) || 0;
				return demoMaterials[index] || null;
			}
			function showMaterialValues() {
				const m = selectedMaterial();
				if (!m) return;
				metal.value = m.metallic;
				rough.value = m.roughness;
				metalOut.textContent = Number(m.metallic).toFixed(2);
				roughOut.textContent = Number(m.roughness).toFixed(2);
			}
			function setMaterialValue(prop, value, out) {
				const m = selectedMaterial();
				if (!m) return;
				m[prop] = value;
				out.textContent = value.toFixed(2);
			}

			lights.checked = !!app.showLights;
			icons.checked = showLightIcons;

			view.addEventListener('change', function () {
				app.debugMode = parseFloat(view.value) || 0;
				if (app.pathTracer) app.pathTracer.reset();
			});
			samples.addEventListener('change', function () {
				if (!app.pathTracer) return;
				app.pathTracer.setMaxSamples(parseInt(samples.value, 10) || 0);
				app.pathTracer.reset();
			});
			// A uniform, so it applies without a recompile; reset because samples
			// clamped differently must not mix with the old accumulation.
			firefly.addEventListener('input', function () {
				const v = parseFloat(firefly.value) || 0;
				fireflyOut.textContent = String(v);
				if (!app.pathTracer) return;
				app.pathTracer.options.fireflyClamp = v;
				app.pathTracer.reset();
			});
			// 0 = non-deterministic; a positive seed replays the same samples.
			seed.addEventListener('change', function () {
				if (!app.pathTracer || !app.pathTracer.setSeed) return;
				const v = parseInt(seed.value, 10) || 0;
				app.pathTracer.setSeed(v);
				setStatus('seed ' + v + (v > 0 ? ' (reproducible)' : ' (random)'));
			});

			// GPU à-trous: no readback, runs every frame while converging, and reuses
			// its result once converged. Mutual exclusion with OIDN keeps the intent
			// of the single `denoise` slot obvious.
			let activeATrous = null;
			function readATrousParams() {
				return {
					iterations: Math.max(1, Math.min(6, parseInt(atrousIters.value, 10) || 3)),
					phiNormal: parseFloat(phiN.value) || 0,
					phiAlbedo: parseFloat(phiA.value) || 0,
					phiDepth: parseFloat(phiD.value) || 0
				};
			}
			function applyATrous() {
				const pt = app.pathTracer;
				if (!pt || !pt.setDenoise) return;
				if (!atrousToggle.checked) {
					pt.setDenoise(null);
					activeATrous = null;
					setStatus('à-trous off');
					return;
				}
				if (!PT_LIB.denoise || !PT_LIB.denoise.aTrous) {
					oidnToggle.checked = false;
					setStatus('load pt_lib/src/denoise/atrous.js first');
					return;
				}
				const params = readATrousParams();
				activeATrous = PT_LIB.denoise.aTrous(params);
				pt.setDenoise(activeATrous);
				oidnToggle.checked = false;
				setStatus('à-trous on (' + params.iterations + ' passes)');
			}
			// Sliders tune the live hook: the pipeline (RTs + effect) is reused, only
			// the parameters change. Higher φ = stricter edges, less smoothing.
			function tuneATrous() {
				phiNOut.textContent = phiN.value;
				phiAOut.textContent = phiA.value;
				phiDOut.textContent = phiD.value;
				if (activeATrous) activeATrous.setParams(readATrousParams());
			}
			atrousToggle.addEventListener('change', applyATrous);
			atrousIters.addEventListener('change', tuneATrous);
			[phiN, phiA, phiD].forEach(function (el) {
				el.addEventListener('input', tuneATrous);
			});

			// OIDN is not vendored (no third-party assets ship in pt_lib), so the page
			// loads a caller-supplied module and drives it through the denoise hook.
			function loadScript(url) {
				return new Promise(function (resolve, reject) {
					const s = document.createElement('script');
					s.src = url;
					s.onload = function () { resolve(); };
					s.onerror = function () { reject(new Error('failed to load ' + url)); };
					document.head.appendChild(s);
				});
			}
			oidnToggle.addEventListener('change', function () {
				const pt = app.pathTracer;
				if (!pt || !pt.setDenoise) return;
				if (!oidnToggle.checked) {
					pt.setDenoise(null);
					setStatus('OIDN off');
					return;
				}
				atrousToggle.checked = false;
				const url = oidnUrl.value.trim();
				if (!url) {
					oidnToggle.checked = false;
					setStatus('set the OIDN module url first');
					return;
				}
				setStatus('loading OIDN…');
				loadScript(url)
					.then(function () {
						const factory = window.createOIDN || window.OIDN || window.Module;
						if (!factory) {
							throw new Error('no createOIDN / OIDN / Module global after loading');
						}
						return typeof factory === 'function' ? factory() : factory;
					})
					.then(function (module) {
						if (!PT_LIB.denoise || !PT_LIB.denoise.oidnHook) {
							throw new Error('load pt_lib/src/denoise/oidn.js first');
						}
						pt.setDenoise(PT_LIB.denoise.oidnHook(module, { hdr: true }));
						setStatus('OIDN ready — denoises on convergence');
					})
					.catch(function (e) {
						oidnToggle.checked = false;
						setStatus('OIDN load failed: ' + (e && e.message ? e.message : e));
					});
			});
			res.addEventListener('input', function () {
				if (!app.pathTracer) return;
				app.pathTracer.options.resolutionScale = parseFloat(res.value);
				app.pathTracer.resize();
				app.pathTracer.reset();
			});
			lights.addEventListener('change', function () {
				app.showLights = lights.checked;
				if (app.pathTracer) app.pathTracer.reset();
			});
			icons.addEventListener('change', function () {
				showLightIcons = icons.checked;
				updateLightIcons();
			});
			// Worker ingest is on by default; toggling re-ingests so the main-thread
			// watchdog (top of this script) shows the difference.
			workerToggle.addEventListener('change', function () {
				if (app.setWorker) app.setWorker(workerToggle.checked);
				forceReingest();
			});
			// Forces the first-hit AOV pass to compose and run with an identity
			// denoise hook: the image must stay identical, and any AOV shader compile
			// error shows up in the console. The real denoiser lands in M6.
			aovsToggle.addEventListener('change', function () {
				const pt = app.pathTracer;
				if (!pt || !pt.setDenoise) return;
				pt.setDenoise(aovsToggle.checked ? function () { return null; } : null);
				setStatus(aovsToggle.checked ? 'AOVs on (identity denoise)' : 'AOVs off');
			});
			model.addEventListener('change', async function () {
				setStatus('loading ' + model.value + '…');
				try {
					await loadAsset(model.value);
				} catch (e) {
					setStatus('model failed: ' + (e && e.message));
					return;
				}
				await forceReingest();
			});
			env.addEventListener('change', async function () {
				setEnvironment(env.value);
				await forceReingest();
			});
			material.addEventListener('change', showMaterialValues);
			metal.addEventListener('input', function () {
				setMaterialValue('metallic', parseFloat(metal.value), metalOut);
			});
			rough.addEventListener('input', function () {
				setMaterialValue('roughness', parseFloat(rough.value), roughOut);
			});
			showMaterialValues();

			// The post-process chain runs on the already-accumulated, tonemapped image,
			// so toggling it or moving the strength is instant — no reset, no recompile.
			post.addEventListener('change', function () {
				if (!app.pathTracer) return;
				if (post.checked) {
					app.pathTracer.addPostProcess(vignettePass);
				} else {
					app.pathTracer.removePostProcess(vignettePass);
				}
			});
			postAmt.addEventListener('input', function () {
				postOut.textContent = parseFloat(postAmt.value).toFixed(2);
			});

			document.getElementById('uiReset').addEventListener('click', function () {
				if (app.pathTracer) app.pathTracer.reset();
			});
			document.getElementById('uiRebuild').addEventListener('click', function () {
				forceReingest();
			});
			// Dumps the current image as PNG; includes the AOVs when the AOV test
			// toggle is on (which is what enables them).
			document.getElementById('uiExport').addEventListener('click', function () {
				const pt = app.pathTracer;
				if (!pt || !pt.exportImage) return;
				setStatus('exporting PNG…');
				pt.exportImage({
					download: true,
					aovs: aovsToggle.checked,
					filename: 'pathtrace',
					aovDepthFar: 20
				}).then(function (images) {
					setStatus('exported ' + Object.keys(images).join(', '));
				}).catch(function (e) {
					setStatus('export failed: ' + (e && e.message ? e.message : e));
				});
			});
		}

		window.app = app;
		app.ready.then(function () {
			window.pt = app.pathTracer;
			applyUISettings();
			attachStatus(app.pathTracer);
			setStatus('warming up');
			wireUI();

			// --- light icons ---------------------------------------------
			// DOM overlay, so it is composited above the canvas and survives the
			// tracer's fullscreen blit (which runs after scene.render()).
			app.scene.onAfterRenderObservable.add(updateLightIcons);
			updateLightIcons();

			// --- diagnostics ---------------------------------------------
			const say = function (m) { console.log('[pt] ' + m); };
			const scene = app.scene;

			say('ready — triangles ' + app.triangleCount +
				', meshes ' + scene.meshes.length +
				', lights ' + scene.lights.length +
				', materials ' + scene.materials.length +
				', textures ' + scene.textures.length);

			scene.onNewMeshAddedObservable.add(function (m) { say('mesh added: ' + m.name); });
			scene.onMeshRemovedObservable.add(function (m) { say('mesh removed: ' + m.name); });
			scene.onNewLightAddedObservable.add(function (l) { say('light added: ' + l.name); });
			scene.onNewMaterialAddedObservable.add(function (m) { say('material added: ' + m.name); });
			scene.onNewTextureAddedObservable.add(function (t) { say('texture added: ' + t.name); });
			scene.meshes.forEach(function (m) {
				if (m.onEnabledStateChangedObservable) {
					m.onEnabledStateChangedObservable.add(function () {
						say('enabled changed: ' + m.name + ' -> ' + m.isEnabled());
					});
				}
			});

			// Frame cost from our own render loop.
			let lastFrame = performance.now();
			app.pathTracer.onProgressObservable.add(function () {
				const t = performance.now();
				const dt = t - lastFrame;
				lastFrame = t;
				if (dt > 200) {
					say('SLOW tracer frame: ' + Math.round(dt) + ' ms');
				}
			});

			// Debug layer always on; report when it is actually up.
			try {
				app.scene.debugLayer.show().then(function () {
					say('debugLayer shown (visible: ' + app.scene.debugLayer.isVisible() + ')');
				});
			} catch (e) {
				console.warn('[demo] debugLayer.show() failed:', e && e.message);
			}
		}).catch(function (e) {
			setStatus('error: ' + (e && e.message ? e.message : e));
			info.style.color = '#f66';
		});

		window.addEventListener('error', function (e) {
			info.innerHTML = '<span style="color:#f66">' + (e.message || e) + '</span>';
		});
	</script>
</body>

</html>
